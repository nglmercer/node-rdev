name: CI
env:
  DEBUG: napi:*
  APP_NAME: node-rdev
  MACOSX_DEPLOYMENT_TARGET: '10.13'
permissions:
  contents: write
  id-token: write
on:
  push:
    branches:
      - main
    tags-ignore:
      - '**'
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - '**/*.gitignore'
      - .editorconfig
      - docs/**
  pull_request: null

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          # MacOS
          - host: macos-latest
            target: x86_64-apple-darwin
            build: bun run build --target x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
            build: bun run build --target aarch64-apple-darwin

          # Windows
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: bun run build --target x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build: bun run build --target aarch64-pc-windows-msvc

          # Windows (32-bit)
          - host: windows-latest
            target: i686-pc-windows-msvc
            build: bun run build --target i686-pc-windows-msvc

          # Linux Native (x64)
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: |
              sudo apt-get update
              sudo apt-get install -y libx11-dev libxtst-dev pkg-config
              bun run build --target x86_64-unknown-linux-gnu

    name: stable - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            .cargo-cache
            target/
          key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}

      - name: Install dependencies
        run: bun install

      - name: Build
        run: ${{ matrix.settings.build }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: ${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  # Linux ARM64 GNU - Use Docker cross-compilation
  build-linux-aarch64-gnu:
    name: stable - aarch64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            .cargo-cache
            target/
          key: aarch64-unknown-linux-gnu-cargo-ubuntu-latest

      - name: Install dependencies
        run: bun install

      - name: Download ARM64 sysroot and build
        run: |
          set -e
          
          # Create sysroot directory
          mkdir -p sysroot-arm64
          
          # Download ARM64 glibc packages
          python3 << 'EOF'
          import urllib.request, gzip, os, sys
          arch = 'arm64'
          mirror = 'http://ports.ubuntu.com/ubuntu-ports'
          dist = 'jammy'
          pkgs = {
              'libx11-dev', 'libxtst-dev', 'libx11-6', 'libxtst6',
              'libxext-dev', 'libxext6', 'libxi-dev', 'libxi6',
              'x11proto-dev', 'libxcb1-dev', 'libxcb1',
              'libxau-dev', 'libxau6', 'libxdmcp-dev', 'libxdmcp6',
              'xtrans-dev', 'libpthread-stubs0-dev',
              'libxfixes-dev', 'libxfixes3', 'libxrender-dev', 'libxrender1',
              'libc6-dev', 'linux-libc-dev'
          }
          os.makedirs('sysroot-arm64', exist_ok=True)
          found = set()
          for comp in ['main', 'universe']:
              try:
                  url = f'{mirror}/dists/{dist}/{comp}/binary-{arch}/Packages.gz'
                  print(f'Fetching package list from {url}')
                  with urllib.request.urlopen(url) as r:
                      content = gzip.decompress(r.read()).decode('utf-8')
                  curr = ''
                  for line in content.splitlines():
                      if line.startswith('Package: '): curr = line.split(': ')[1]
                      if line.startswith('Filename: ') and curr in pkgs and curr not in found:
                          pkg_url = f'{mirror}/{line.split(": ")[1]}'
                          print(f'Downloading {curr}...')
                          if os.system(f'wget -q {pkg_url} -O deb.deb && dpkg -x deb.deb sysroot-arm64 && rm deb.deb') != 0:
                              print(f'Failed to download {curr}')
                              sys.exit(1)
                          found.add(curr)
              except Exception as e:
                  print(f'Error: {e}')
          print(f'Downloaded {len(found)} packages')
          EOF
          
          # Create symlinks for library paths
          mkdir -p sysroot-arm64/usr/lib
          if [ -d "sysroot-arm64/lib/aarch64-linux-gnu" ]; then
            ln -sf ../../lib/aarch64-linux-gnu sysroot-arm64/usr/lib/aarch64-linux-gnu 2>/dev/null || true
          fi
          
          # Create Zig-based linker wrapper
          cat > zig-cc-aarch64 << 'ZIGCC'
          #!/bin/bash
          # Filter out problematic flags and use zig cc
          args=()
          for arg in "$@"; do
            case "$arg" in
              -lgcc_s) args+=("-lgcc") ;;
              -l:libgcc_s.so.1) args+=("-lgcc") ;;
              -march=*) ;; # Skip march flags
              -mcpu=*) ;; # Skip mcpu flags
              *) args+=("$arg") ;;
            esac
          done
          exec zig cc -target aarch64-linux-gnu "${args[@]}"
          ZIGCC
          chmod +x zig-cc-aarch64
          
          # Configure cargo
          mkdir -p .cargo
          cat > .cargo/config.toml << EOF
          [target.aarch64-unknown-linux-gnu]
          linker = "$(pwd)/zig-cc-aarch64"
          rustflags = ["-C", "link-arg=--sysroot=$(pwd)/sysroot-arm64"]
          EOF
          
          # Environment variables
          export PKG_CONFIG_SYSROOT_DIR=$(pwd)/sysroot-arm64
          export PKG_CONFIG_PATH=$(pwd)/sysroot-arm64/usr/lib/aarch64-linux-gnu/pkgconfig:$(pwd)/sysroot-arm64/usr/share/pkgconfig
          export PKG_CONFIG_ALLOW_CROSS=1
          export CC="$(pwd)/zig-cc-aarch64"
          export CXX="$(pwd)/zig-cc-aarch64"
          
          bun run build --target aarch64-unknown-linux-gnu

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-aarch64-unknown-linux-gnu
          path: ${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  # Linux ARMv7 GNU
  build-linux-armv7-gnu:
    name: stable - armv7-unknown-linux-gnueabihf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: armv7-unknown-linux-gnueabihf

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            .cargo-cache
            target/
          key: armv7-unknown-linux-gnueabihf-cargo-ubuntu-latest

      - name: Install dependencies
        run: bun install

      - name: Download ARMv7 sysroot and build
        run: |
          set -e
          
          # Create sysroot directory
          mkdir -p sysroot-armhf
          
          # Download ARMv7 glibc packages
          python3 << 'EOF'
          import urllib.request, gzip, os, sys
          arch = 'armhf'
          mirror = 'http://ports.ubuntu.com/ubuntu-ports'
          dist = 'jammy'
          pkgs = {
              'libx11-dev', 'libxtst-dev', 'libx11-6', 'libxtst6',
              'libxext-dev', 'libxext6', 'libxi-dev', 'libxi6',
              'x11proto-dev', 'libxcb1-dev', 'libxcb1',
              'libxau-dev', 'libxau6', 'libxdmcp-dev', 'libxdmcp6',
              'xtrans-dev', 'libpthread-stubs0-dev',
              'libxfixes-dev', 'libxfixes3', 'libxrender-dev', 'libxrender1',
              'libc6-dev', 'linux-libc-dev'
          }
          os.makedirs('sysroot-armhf', exist_ok=True)
          found = set()
          for comp in ['main', 'universe']:
              try:
                  url = f'{mirror}/dists/{dist}/{comp}/binary-{arch}/Packages.gz'
                  print(f'Fetching package list from {url}')
                  with urllib.request.urlopen(url) as r:
                      content = gzip.decompress(r.read()).decode('utf-8')
                  curr = ''
                  for line in content.splitlines():
                      if line.startswith('Package: '): curr = line.split(': ')[1]
                      if line.startswith('Filename: ') and curr in pkgs and curr not in found:
                          pkg_url = f'{mirror}/{line.split(": ")[1]}'
                          print(f'Downloading {curr}...')
                          if os.system(f'wget -q {pkg_url} -O deb.deb && dpkg -x deb.deb sysroot-armhf && rm deb.deb') != 0:
                              print(f'Failed to download {curr}')
                              sys.exit(1)
                          found.add(curr)
              except Exception as e:
                  print(f'Error: {e}')
          print(f'Downloaded {len(found)} packages')
          EOF
          
          # Create Zig-based linker wrapper
          cat > zig-cc-armhf << 'ZIGCC'
          #!/bin/bash
          args=()
          for arg in "$@"; do
            case "$arg" in
              -lgcc_s) args+=("-lgcc") ;;
              -l:libgcc_s.so.1) args+=("-lgcc") ;;
              -march=*) ;;
              -mcpu=*) ;;
              *) args+=("$arg") ;;
            esac
          done
          exec zig cc -target arm-linux-gnueabihf "${args[@]}"
          ZIGCC
          chmod +x zig-cc-armhf
          
          # Configure cargo
          mkdir -p .cargo
          cat > .cargo/config.toml << EOF
          [target.armv7-unknown-linux-gnueabihf]
          linker = "$(pwd)/zig-cc-armhf"
          rustflags = ["-C", "link-arg=--sysroot=$(pwd)/sysroot-armhf"]
          EOF
          
          # Environment variables
          export PKG_CONFIG_SYSROOT_DIR=$(pwd)/sysroot-armhf
          export PKG_CONFIG_PATH=$(pwd)/sysroot-armhf/usr/lib/arm-linux-gnueabihf/pkgconfig:$(pwd)/sysroot-armhf/usr/share/pkgconfig
          export PKG_CONFIG_ALLOW_CROSS=1
          export CC="$(pwd)/zig-cc-armhf"
          export CXX="$(pwd)/zig-cc-armhf"
          
          bun run build --target armv7-unknown-linux-gnueabihf

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-armv7-unknown-linux-gnueabihf
          path: ${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  # Linux x86_64 Musl - Use Alpine Docker for native musl build
  build-linux-x64-musl:
    name: stable - x86_64-unknown-linux-musl
    runs-on: ubuntu-latest
    container:
      image: node:20-alpine
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apk add --no-cache \
            bash curl git python3 \
            build-base musl-dev \
            libx11-dev libxtst-dev libxi-dev \
            libxext-dev libxfixes-dev libxrender-dev \
            pkgconfig

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          export BUN_INSTALL="$HOME/.bun"
          export PATH="$BUN_INSTALL/bin:$PATH"
          echo "BUN_INSTALL=$HOME/.bun" >> $GITHUB_ENV
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Add target
        run: |
          source $HOME/.cargo/env
          rustup target add x86_64-unknown-linux-musl

      - name: Install dependencies
        run: |
          source $HOME/.cargo/env
          $HOME/.bun/bin/bun install

      - name: Build
        run: |
          source $HOME/.cargo/env
          $HOME/.bun/bin/bun run build --target x86_64-unknown-linux-musl

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-x86_64-unknown-linux-musl
          path: ${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  # Linux aarch64 Musl - Use QEMU with Alpine Docker
  build-linux-aarch64-musl:
    name: stable - aarch64-unknown-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build in Alpine ARM64 container
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            node:20-alpine sh -c '
              set -e
              
              # Install build dependencies
              apk add --no-cache \
                bash curl git python3 \
                build-base musl-dev \
                libx11-dev libxtst-dev libxi-dev \
                libxext-dev libxfixes-dev libxrender-dev \
                pkgconfig
              
              # Install Bun
              curl -fsSL https://bun.sh/install | bash
              export BUN_INSTALL="$HOME/.bun"
              export PATH="$BUN_INSTALL/bin:$PATH"
              
              # Install Rust
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
              source $HOME/.cargo/env
              
              # Install dependencies and build
              bun install
              bun run build --target aarch64-unknown-linux-musl
            '

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-aarch64-unknown-linux-musl
          path: ${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  build-freebsd:
    runs-on: macos-13
    name: Build FreeBSD
    steps:
      - uses: actions/checkout@v4
      - name: Build
        id: build
        uses: cross-platform-actions/action@v0.24.0
        env:
          DEBUG: napi:*
          RUSTUP_IO_THREADS: 1
        with:
          operating_system: freebsd
          version: '13.2'
          memory: 8G
          cpu_count: 3
          environment_variables: DEBUG RUSTUP_IO_THREADS
          shell: bash
          run: |
            sudo pkg install -y -f curl node libnghttp2 npm
            sudo npm install -g bun --ignore-scripts
            curl https://sh.rustup.rs -sSf --output rustup.sh
            sh rustup.sh -y --profile minimal --default-toolchain beta
            source "$HOME/.cargo/env"
            bun install
            bun run build
            rm -rf node_modules
            rm -rf target
            rm -rf .bun/cache
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-freebsd
          path: ${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  test-macOS-windows-binding:
    name: Test bindings on ${{ matrix.settings.target }} - node@${{ matrix.node }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            architecture: x64
          - host: macos-latest
            target: aarch64-apple-darwin
            architecture: arm64
          - host: macos-latest
            target: x86_64-apple-darwin
            architecture: x64
        node:
          - '20'
          - '22'
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          architecture: ${{ matrix.settings.architecture }}
      - name: Install dependencies
        run: bun install
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: .
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Test bindings
        run: bun test

  test-linux-x64-gnu-binding:
    name: Test bindings on Linux-x64-gnu - node@${{ matrix.node }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        node:
          - '20'
          - '22'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: .
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Test bindings
        run: docker run --rm -v $(pwd):/build -w /build node:${{ matrix.node }}-slim bun test

  test-linux-x64-musl-binding:
    name: Test bindings on x86_64-unknown-linux-musl - node@${{ matrix.node }}
    needs:
      - build-linux-x64-musl
    strategy:
      fail-fast: false
      matrix:
        node:
          - '20'
          - '22'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install dependencies
        run: |
          bun config set supportedArchitectures.libc "musl"
          bun install
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: bindings-x86_64-unknown-linux-musl
          path: .
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Test bindings
        run: docker run --rm -v $(pwd):/build -w /build node:${{ matrix.node }}-alpine bun test

  test-linux-aarch64-gnu-binding:
    name: Test bindings on aarch64-unknown-linux-gnu - node@${{ matrix.node }}
    needs:
      - build-linux-aarch64-gnu
    strategy:
      fail-fast: false
      matrix:
        node:
          - '20'
          - '22'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: bindings-aarch64-unknown-linux-gnu
          path: .
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Install dependencies
        run: |
          bun config set supportedArchitectures.cpu "arm64"
          bun config set supportedArchitectures.libc "glibc"
          bun install
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
      - name: Setup and run tests
        uses: addnab/docker-run-action@v3
        with:
          image: node:${{ matrix.node }}-slim
          options: '--platform linux/arm64 -v ${{ github.workspace }}:/build -w /build'
          run: |
            set -e
            bun test
            ls -la

  test-linux-aarch64-musl-binding:
    name: Test bindings on aarch64-unknown-linux-musl - node@lts
    needs:
      - build-linux-aarch64-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: bindings-aarch64-unknown-linux-musl
          path: .
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Install dependencies
        run: |
          bun config set supportedArchitectures.cpu "arm64"
          bun config set supportedArchitectures.libc "musl"
          bun install
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
      - name: Setup and run tests
        uses: addnab/docker-run-action@v3
        with:
          image: node:lts-alpine
          options: '--platform linux/arm64 -v ${{ github.workspace }}:/build -w /build'
          run: |
            set -e
            yarn test

  test-linux-arm-gnueabihf-binding:
    name: Test bindings on armv7-unknown-linux-gnueabihf - node@${{ matrix.node }}
    needs:
      - build-linux-armv7-gnu
    strategy:
      fail-fast: false
      matrix:
        node:
          - '20'
          - '22'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: bindings-armv7-unknown-linux-gnueabihf
          path: .
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Install dependencies
        run: |
          bun config set supportedArchitectures.cpu "arm"
          bun install
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
      - name: Setup and run tests
        uses: addnab/docker-run-action@v3
        with:
          image: node:${{ matrix.node }}-bullseye-slim
          options: '--platform linux/arm/v7 -v ${{ github.workspace }}:/build -w /build'
          run: |
            set -e
            bun test
            ls -la

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - build-freebsd
      - test-macOS-windows-binding
      - test-linux-x64-gnu-binding
      - test-linux-x64-musl-binding
      - test-linux-aarch64-gnu-binding
      - test-linux-aarch64-musl-binding
      - test-linux-arm-gnueabihf-binding
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Move artifacts
        run: bun artifacts
      - name: List packages
        run: ls -R ./npm
        shell: bash
      - name: Publish
        run: |
          npm config set provenance true
          if git log -1 --pretty=%B | grep "^[0-9]\+\.[0-9]\+\.[0-9]\+$";
          then
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc
            npm publish --access public
          elif git log -1 --pretty=%B | grep "^[0-9]\+\.[0-9]\+\.[0-9]\+";
          then
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc
            npm publish --tag next --access public
          else
            echo "Not a release, skipping publish"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}